name: Android CI/CD (Build APK)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Prepare Keystore and Secrets
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        # Inject Gemini API Key into .env if available
        touch .env
        if [ -n "$GEMINI_KEY" ]; then
          echo "GEMINI_API_KEY=$GEMINI_KEY" >> .env
        fi
        
        # Decode Release Keystore if present in GitHub Secrets
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          echo "Release keystore decoded successfully."
        fi

    - name: Grant Execute Permission to Gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        fi

    - name: Build APK with Gradle
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        STORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
      run: |
        # Try release build if keystore exists, otherwise build debug APK
        if [ -f "my-upload-key.jks" ]; then
          echo "Building Release APK..."
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi
        else
          echo "Building Debug APK (Fallback since release keystore is not decoded)..."
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: app/build/outputs/apk/**/*.apk
